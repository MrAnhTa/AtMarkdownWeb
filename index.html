<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07142f" />
    <script>
      try {
        const theme = localStorage.getItem('atmarkdown-theme') === 'light' ? 'light' : 'dark'
        document.documentElement.dataset.theme = theme
      } catch { /* default to dark when storage is unavailable */ }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="AtMarkdown Web - trình đọc Markdown đẹp, nhanh và riêng tư ngay trên trình duyệt."
    />
    <title>AtMarkdown - Markdown Reader</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
